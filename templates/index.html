<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Study Coach</title>
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            min-height: 100vh;
            background: linear-gradient(135deg, #0a0a1a 0%, #101026 50%, #1a0b2e 100%);
            color: #e2e8f0;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 40px 20px;
        }

        .glass-container {
            width: 100%;
            max-width: 750px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 20px;
            padding: 35px;
            box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
        }

        h2 {
            font-size: 28px;
            font-weight: 700;
            margin-bottom: 25px;
            text-align: center;
            background: linear-gradient(90deg, #38ef7d, #11998e, #00d2ff);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        .full-width {
            grid-column: span 2;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-size: 14px;
            color: #cbd5e1;
            font-weight: 500;
        }

        input, select, textarea {
            width: 100%;
            padding: 12px 16px;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.15);
            border-radius: 10px;
            color: #fff;
            font-size: 15px;
            outline: none;
            transition: all 0.3s ease;
        }

        input:focus, select:focus, textarea:focus {
            border-color: #00d2ff;
            background: rgba(255, 255, 255, 0.12);
            box-shadow: 0 0 12px rgba(0, 210, 255, 0.3);
        }

        select option {
            background: #121226;
            color: #fff;
        }

        textarea {
            resize: vertical;
        }

        button {
            width: 100%;
            padding: 14px;
            margin-top: 10px;
            background: linear-gradient(135deg, #00c6ff 0%, #0072ff 100%);
            border: none;
            border-radius: 10px;
            color: white;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 4px 15px rgba(0, 114, 255, 0.4);
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(0, 114, 255, 0.6);
        }

        #outputContainer {
            margin-top: 30px;
            display: none;
        }

        h3 {
            font-size: 20px;
            margin-bottom: 12px;
            color: #38ef7d;
        }

        .glass-output {
            background: rgba(0, 0, 0, 0.3);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 12px;
            padding: 20px;
            white-space: pre-wrap;
            line-height: 1.6;
            font-size: 15px;
            color: #f1f5f9;
        }

        @media (max-width: 600px) {
            .form-grid {
                grid-template-columns: 1fr;
            }
            .full-width {
                grid-column: span 1;
            }
        }
    </style>
</head>
<body>

<div class="glass-container">
    <h2>AI Study Coach</h2>
    <form id="studyForm">
        <div class="form-grid">
            <div class="form-group">
                <label>Student Name</label>
                <input type="text" id="name" value="Sarah" required>
            </div>
            <div class="form-group">
                <label>Subject</label>
                <input type="text" id="subject" value="Python Programming" required>
            </div>
            <div class="form-group full-width">
                <label>Weak Topics</label>
                <textarea id="weak_topics" rows="3" required>Functions, Loops, Debugging</textarea>
            </div>
            <div class="form-group">
                <label>Days Remaining</label>
                <input type="number" id="days_remaining" value="5" required>
            </div>
            <div class="form-group">
                <label>Study Hours / Day</label>
                <input type="number" step="0.5" id="hours_per_day" value="2" required>
            </div>
            <div class="form-group">
                <label>Skill Level</label>
                <select id="skill_level">
                    <option value="Beginner">Beginner</option>
                    <option value="Intermediate">Intermediate</option>
                    <option value="Advanced">Advanced</option>
                </select>
            </div>
            <div class="form-group">
                <label>Prompting Technique</label>
                <select id="technique">
                    <option value="zero_shot">Zero-Shot</option>
                    <option value="few_shot">Few-Shot</option>
                    <option value="chain_of_thought">Structured Reasoning (Chain of Thought)</option>
                </select>
            </div>
        </div>
        <button type="submit">Generate Study Plan</button>
    </form>

    <div id="outputContainer">
        <h3>Generated Study Plan:</h3>
        <div id="output" class="glass-output">Generating...</div>
    </div>
</div>

<script>
    document.getElementById('studyForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        
        const outputContainer = document.getElementById('outputContainer');
        const output = document.getElementById('output');
        outputContainer.style.display = 'block';
        output.innerText = 'Generating study plan with Gemini...';

        const payload = {
            name: document.getElementById('name').value,
            subject: document.getElementById('subject').value,
            weak_topics: document.getElementById('weak_topics').value,
            days_remaining: parseInt(document.getElementById('days_remaining').value),
            hours_per_day: parseFloat(document.getElementById('hours_per_day').value),
            skill_level: document.getElementById('skill_level').value,
            technique: document.getElementById('technique').value
        };

        try {
            const response = await fetch('/generate-plan', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const result = await response.json();
            if (result.status === 'success') {
                output.innerText = result.plan;
            } else {
                output.innerText = 'Error generating plan.';
            }
        } catch (err) {
            output.innerText = 'Failed to fetch response from server.';
        }
    });
</script>

</body>
</html>
